<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saran — Memory & Mind Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: '#F9F8F6',
                        obsidian: '#141413',
                        champagne: '#A38B6D',
                        stone: '#787672',
                        line: '#E5E3DF'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #F9F8F6;
            color: #141413;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        .editorial-title {
            font-family: 'Cormorant Garamond', serif;
        }
        /* 3D Card Flip Animation */
        .perspective {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.375rem;
        }
        .card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-obsidian selection:text-canvas">

    <!-- Header -->
    <header class="py-8 px-6 border-b border-line">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="#" class="editorial-title text-2xl tracking-widest font-light uppercase">Saran.</a>
            <span class="text-xs tracking-widest uppercase text-stone">Mind & Memory</span>
        </div>
    </header>

    <!-- Main Game Section -->
    <main class="max-w-xl mx-auto px-6 py-12 w-full flex-grow flex flex-col justify-center items-center">
        
        <!-- Game Info Dashboard -->
        <div class="w-full grid grid-cols-3 gap-4 mb-8 text-center border-b border-line pb-6">
            <div>
                <span class="block text-[10px] uppercase tracking-[0.2em] text-stone">Time</span>
                <span id="timer" class="editorial-title text-2xl font-light">00:00</span>
            </div>
            <div>
                <span class="block text-[10px] uppercase tracking-[0.2em] text-stone">Moves</span>
                <span id="moves" class="editorial-title text-2xl font-light">0</span>
            </div>
            <div>
                <span class="block text-[10px] uppercase tracking-[0.2em] text-stone">Best Moves</span>
                <span id="best-score" class="editorial-title text-2xl font-light text-champagne">-</span>
            </div>
        </div>

        <!-- Card Grid (4x4) -->
        <div id="game-board" class="grid grid-cols-4 gap-3 sm:gap-4 w-full aspect-square max-w-md">
            <!-- Cards will be dynamically generated by JS -->
        </div>

        <!-- Controls -->
        <div class="mt-10 flex gap-4">
            <button onclick="resetGame()" class="text-xs tracking-widest uppercase border border-obsidian px-8 py-3 rounded-full hover:bg-obsidian hover:text-canvas transition-all duration-300">
                Restart Game
            </button>
        </div>
    </main>

    <!-- Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-obsidian/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="bg-canvas border border-line p-8 sm:p-12 rounded-sm max-w-sm w-full text-center shadow-2xl mx-4 transform scale-95 transition-transform duration-500" id="modal-content">
            <p class="text-xs uppercase tracking-[0.2em] text-champagne mb-2">Congratulations</p>
            <h2 class="editorial-title text-4xl font-light mb-4">Completed</h2>
            <p class="text-stone text-sm font-light mb-6">
                ใช้เวลาไป <span id="final-time" class="text-obsidian font-medium">00:00</span> <br>
                จำนวนการเดิน <span id="final-moves" class="text-obsidian font-medium">0</span> ครั้ง
            </p>
            <button onclick="closeModalAndReset()" class="w-full text-xs tracking-widest uppercase border border-obsidian bg-obsidian text-canvas py-3.5 rounded-full hover:bg-champagne hover:border-champagne transition-all duration-300">
                Play Again
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 border-t border-line text-center text-xs text-stone">
        © 2026 Saran. Minimalist Game Architecture.
    </footer>

    <!-- Game Logic Script -->
    <script>
        // List of Lucide Icons (8 pairs)
        const iconList = [
            'gem', 'crown', 'sparkles', 'feather', 
            'compass', 'moon', 'sun', 'flame'
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let isGameStarted = false;
        let isBoardLocked = false;

        const board = document.getElementById('game-board');
        const movesEl = document.getElementById('moves');
        const timerEl = document.getElementById('timer');
        const bestScoreEl = document.getElementById('best-score');

        // Load Best Score from localStorage
        function loadBestScore() {
            const best = localStorage.getItem('saran_best_moves');
            bestScoreEl.textContent = best ? best : '-';
        }

        // Initialize Game
        function initGame() {
            board.innerHTML = '';
            cards = [...iconList, ...iconList]; // Duplicate to make pairs
            cards.sort(() => Math.random() - 0.5); // Shuffle

            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timerSeconds = 0;
            isGameStarted = false;
            isBoardLocked = false;
            
            movesEl.textContent = '0';
            timerEl.textContent = '00:00';
            clearInterval(timerInterval);

            // Render Cards
            cards.forEach((iconName, index) => {
                const card = document.createElement('div');
                card.className = 'card perspective cursor-pointer w-full h-full';
                card.dataset.icon = iconName;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-inner border border-line rounded-sm">
                        <!-- Front Face (Hidden/Cover) -->
                        <div class="card-front bg-[#EBE9E4] flex items-center justify-center hover:bg-[#E2DFD8] transition-colors">
                            <span class="editorial-title text-stone/40 text-lg">S</span>
                        </div>
                        <!-- Back Face (Revealed Icon) -->
                        <div class="card-back bg-obsidian text-canvas flex items-center justify-center">
                            <i data-lucide="${iconName}" class="w-6 h-6 sm:w-8 sm:h-8 text-champagne"></i>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });

            lucide.createIcons();
            loadBestScore();
        }

        // Start Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // Flip Card Action
        function flipCard(card) {
            if (isBoardLocked || card.classList.contains('flipped') || flippedCards.includes(card)) return;

            if (!isGameStarted) {
                isGameStarted = true;
                startTimer();
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        // Check if 2 flipped cards match
        function checkMatch() {
            isBoardLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.icon === card2.dataset.icon) {
                // Match Found
                matchedPairs++;
                flippedCards = [];
                isBoardLocked = false;

                if (matchedPairs === iconList.length) {
                    gameWin();
                }
            } else {
                // Not Match - Flip back
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isBoardLocked = false;
                }, 800);
            }
        }

        // Game Win Event
        function gameWin() {
            clearInterval(timerInterval);
            
            // Save Best Score
            const currentBest = localStorage.getItem('saran_best_moves');
            if (!currentBest || moves < parseInt(currentBest)) {
                localStorage.setItem('saran_best_moves', moves);
                bestScoreEl.textContent = moves;
            }

            // Show Modal
            document.getElementById('final-time').textContent = timerEl.textContent;
            document.getElementById('final-moves').textContent = moves;

            const modal = document.getElementById('victory-modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModalAndReset() {
            const modal = document.getElementById('victory-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            initGame();
        }

        function resetGame() {
            initGame();
        }

        // Start on load
        window.onload = initGame;
    </script>
</body>
</html>
